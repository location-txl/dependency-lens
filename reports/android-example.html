<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>依赖分析报告 · Dependency Lens</title>
    <style>
      :root {
  color-scheme: light;
  --ink: #0b1b3a;
  --text: #435476;
  --muted: #73819c;
  --line: #e0e7f0;
  --soft: #f6f9fd;
  --blue: #0065ff;
  --cyan: #e9fafd;
  --amber: #d67c00;
  --amber-bg: #fff5e5;
  --error: #b33a32;
  --font:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font: 15px/1.55 var(--font);
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  outline-offset: 3px;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--blue);
}
button {
  background: none;
  border: 0;
}
a {
  color: var(--blue);
}
[hidden] {
  display: none !important;
}
svg.icon {
  width: 20px;
  height: 20px;
  stroke-width: 1.7;
  vertical-align: middle;
  flex: none;
}
.report-header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  color: var(--ink);
  text-decoration: none;
  font-size: 22px;
}
.brand svg {
  width: 29px;
  height: 29px;
  color: #0098d5;
  stroke-width: 1.8;
}
.report-meta {
  display: flex;
  gap: 22px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
}
.app-shell {
  height: calc(100vh - 60px);
  min-height: 640px;
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
}
.module-sidebar {
  background: #f4f8fc;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding-top: 20px;
  min-height: 0;
}
.project-name {
  font-size: 16px;
  font-weight: 650;
  padding: 0 22px 18px;
  overflow-wrap: anywhere;
}
.module-sidebar nav {
  overflow: auto;
}
.module-btn {
  display: block;
  text-align: left;
  width: calc(100% - 20px);
  padding: 8px 18px;
  margin: 0 10px 7px;
  border-radius: 5px;
  color: var(--text);
  font-size: 15px;
  border-left: 3px solid transparent;
  overflow-wrap: anywhere;
}
.module-btn:hover {
  background: #eaf1f9;
}
.module-btn.active {
  background: #e1f1ff;
  color: #0074ef;
  border-left-color: #1685ff;
  font-weight: 650;
}
.module-btn small {
  font-size: 10px;
  margin-left: 7px;
  opacity: 0.7;
}
.sidebar-note {
  margin-top: auto;
  padding: 20px;
  color: #8a98b0;
  font-size: 11px;
}
.sidebar-note small {
  display: block;
  font-size: 11px;
  margin-top: 2px;
}
.workspace {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.intro {
  padding: 24px 28px 20px;
}
.intro h1 {
  margin: 0;
  font-size: 36px;
  line-height: 1.35;
  letter-spacing: -0.7px;
  font-weight: 730;
}
.intro > p {
  color: var(--muted);
  font-size: 16px;
  margin: 5px 0 25px;
}
.scope-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.scope-row label {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
  white-space: nowrap;
}
.scope-row select {
  height: 38px;
  min-width: 118px;
  padding: 0 30px 0 12px;
  border: 1px solid #d4ddeb;
  border-radius: 5px;
  background: #fff;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  max-width: 280px;
}
.scope-row .configuration-label {
  flex: 1;
}
.configuration-label select {
  width: 100%;
  min-width: 220px;
}
.stats {
  display: flex;
  gap: 19px;
  white-space: nowrap;
  margin-left: auto;
  align-items: center;
}
.stats span {
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.stats strong {
  color: var(--ink);
  font-size: 18px;
}
.stats .changed-count {
  color: var(--amber);
}
.search-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 17px;
}
.search-field {
  display: flex;
  align-items: center;
  width: 420px;
  border: 1px solid #cbd6e8;
  border-radius: 5px;
  height: 40px;
  padding: 0 12px;
  gap: 10px;
  color: var(--muted);
}
.search-field:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px #0065ff12;
}
.search-field input {
  min-width: 0;
  flex: 1;
  border: 0;
  background: none;
  outline: none;
  color: var(--ink);
  font-size: 15px;
  height: 100%;
}
.search-field input::placeholder {
  color: #8a98ae;
}
.search-field input::-webkit-search-cancel-button {
  display: none;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 4px;
  color: var(--text);
  padding: 4px;
}
.icon-btn:hover {
  background: #ecf2f9;
}
.toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  color: var(--text);
  font-size: 14px;
  position: relative;
}
.toggle-label input {
  position: absolute;
  width: 34px;
  height: 22px;
  opacity: 0;
  margin: 0;
}
.toggle-track {
  height: 22px;
  width: 36px;
  border-radius: 20px;
  background: #c5cbd3;
  position: relative;
  flex: none;
  transition: background 0.15s;
}
.toggle-track:after {
  content: "";
  position: absolute;
  left: 3px;
  top: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px #0002;
  transition: transform 0.15s;
}
.toggle-label input:checked + .toggle-track {
  background: var(--blue);
}
.toggle-label input:checked + .toggle-track:after {
  transform: translateX(14px);
}
.toggle-label input:focus-visible + .toggle-track {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}
.browser-area {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 460px;
  border-top: 1px solid var(--line);
}
.dependency-view {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.view-toolbar {
  height: 46px;
  min-height: 46px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: #fbfdff;
  gap: 14px;
}
.view-tabs {
  display: flex;
  align-self: stretch;
  gap: 24px;
}
.view-tabs button {
  color: var(--muted);
  padding: 0 13px;
  border-bottom: 3px solid transparent;
  font-size: 14px;
}
.view-tabs button[aria-selected="true"] {
  color: var(--blue);
  border-bottom-color: var(--blue);
  font-weight: 650;
}
.view-tabs button:hover {
  color: var(--blue);
}
#current-dependency {
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-view {
  overflow: auto;
  flex: 1;
  position: relative;
  min-height: 0;
}
.tree-header,
.tree-row {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) 92px 142px;
  align-items: center;
  padding: 0 23px;
  gap: 12px;
  min-width: 530px;
}
.tree-header {
  height: 42px;
  font-size: 12px;
  color: var(--text);
  background: var(--soft);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 2;
}
.tree-row {
  min-height: 52px;
  border-bottom: 1px solid #edf1f7;
  cursor: pointer;
  position: relative;
}
.tree-row:hover {
  background: #f6faff;
}
.tree-row.selected {
  background: var(--cyan);
}
.tree-row:focus-visible {
  outline-offset: -3px;
}
.tree-row .dependency-name {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding-left: calc(var(--depth, 0) * 22px);
  position: relative;
}
.tree-row .dependency-name .branch-line {
  position: absolute;
  left: calc(var(--depth, 0) * 22px - 11px);
  top: -17px;
  bottom: -17px;
  border-left: 1px dashed #d1dce8;
}
.tree-row .dependency-name .branch-line:after {
  content: "";
  position: absolute;
  left: 0;
  top: 26px;
  width: 9px;
  border-top: 1px dashed #d1dce8;
}
.expand-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 26px;
  padding: 0;
  flex: none;
  position: relative;
  z-index: 1;
  background: transparent;
}
.expand-btn svg {
  width: 16px;
  height: 16px;
}
.expand-spacer {
  width: 20px;
  flex: none;
}
.node-icon {
  color: var(--ink);
  display: inline-flex;
}
.node-icon svg {
  width: 18px;
  height: 18px;
}
.coordinate {
  font-family: var(--mono);
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.node-label {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  flex: 1;
}
.node-label .coordinate {
  display: block;
}
.node-copy {
  min-width: 0;
  overflow: hidden;
}
.node-copy small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.25;
  margin: 2px 0 6px;
}
.request-version,
.selected-version {
  font-family: var(--mono);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.selected-version {
  font-weight: 650;
  display: flex;
  gap: 10px;
  align-items: center;
}
.change-label {
  font: 11px var(--font);
  color: var(--amber);
  white-space: nowrap;
  font-weight: 500;
  font-size: 12px;
}
.type-label {
  font: 10px var(--font);
  color: var(--muted);
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 3px;
}
.error-text {
  color: var(--error) !important;
}
.cycle-text {
  font: 10px var(--font);
  color: var(--muted);
}
.load-more {
  margin: 18px 24px;
  color: var(--blue);
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  min-height: 260px;
  color: var(--muted);
  padding: 30px;
  flex: 1;
}
.empty-state svg {
  width: 34px;
  height: 34px;
  color: #94abc5;
}
.empty-state h3 {
  margin: 0;
  color: var(--text);
  font-size: 16px;
}
.empty-state p {
  margin: 0;
  max-width: 330px;
  font-size: 13px;
}
.dependency-details {
  border-left: 1px solid var(--line);
  padding: 24px 24px 28px;
  overflow: auto;
  min-width: 0;
}
.details-header {
  position: relative;
}
.details-header h2 {
  padding-right: 80px;
  font-size: 27px;
  line-height: 1.2;
  margin: 4px 0 8px;
  overflow-wrap: anywhere;
}
.details-group {
  font-size: 15px;
  color: var(--text);
  font-family: var(--mono);
  overflow-wrap: anywhere;
}
.copy-btn {
  position: absolute;
  right: 0;
  top: 6px;
  border: 1px solid #cfd9e8;
  border-radius: 5px;
  padding: 7px 9px;
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 11px;
  background: #fff;
}
.copy-btn svg {
  width: 15px;
  height: 15px;
}
.copy-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}
.detail-section {
  padding: 19px 0;
  border-bottom: 1px solid var(--line);
}
.detail-section:last-child {
  border-bottom: 0;
}
.detail-section h3 {
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 13px;
}
.detail-section h3 svg {
  width: 20px;
  height: 20px;
}
.detail-label {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  margin: 6px 0 8px;
}
.final-version {
  font-size: 43px;
  font-weight: 720;
  color: var(--blue);
  letter-spacing: 0.5px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.request-row {
  font-family: var(--mono);
  display: flex;
  gap: 15px;
  padding: 8px 0;
  border-top: 1px solid #edf1f7;
  font-weight: 600;
  font-size: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.request-row.changed {
  color: var(--amber);
}
.request-row small {
  font-family: var(--font);
  font-weight: 400;
  font-size: 10px;
  line-height: 1.4;
}
.request-row .icon {
  width: 14px;
  height: 14px;
  color: var(--text);
}
.reason-title {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 5px;
}
.reason-description,
.detail-note {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  overflow-wrap: anywhere;
  margin: 0;
}
.reason-item + .reason-item {
  margin-top: 12px;
}
.incoming-path {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.path-number {
  width: 20px;
  height: 20px;
  background: #edf3fa;
  border-radius: 50%;
  text-align: center;
  font-size: 12px;
  line-height: 20px;
}
.path-coordinates {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}
.path-coordinates span {
  display: inline;
}
.path-arrow {
  color: #8ca0bc;
  margin: 0 5px;
}
.text-button {
  font-size: 14px;
  color: var(--blue);
  padding: 4px 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.text-button:hover {
  text-decoration: underline;
}
.text-button .icon {
  width: 16px;
  height: 16px;
}
.child-item {
  display: block;
  text-align: left;
  padding: 7px 0;
  color: var(--text);
  font: 11px/1.6 var(--mono);
  overflow-wrap: anywhere;
  border-top: 1px solid #edf1f7;
  width: 100%;
}
.child-item:hover {
  color: var(--blue);
}
.attribute-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;
  margin: 10px 0 0;
  font: 10px/1.6 var(--mono);
  overflow-wrap: anywhere;
}
.attribute-list dt {
  color: var(--muted);
}
.attribute-list dd {
  margin: 0;
  color: var(--text);
}
.variant-details {
  margin-top: 16px;
  font-size: 11px;
  color: var(--muted);
}
.variant-details summary {
  cursor: pointer;
}
.report-footer {
  height: 44px;
  min-height: 44px;
  padding: 0 28px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
}
.report-footer > span + span:before {
  content: "·";
  margin-right: 8px;
}
.report-footer button {
  margin-left: auto;
  color: var(--muted);
  font-size: 10px;
  padding: 4px 0;
  white-space: nowrap;
}
.report-footer button:hover {
  color: var(--blue);
}
.issue-banner {
  background: #fff7e8;
  border-top: 1px solid #f0dcb4;
  color: #8d5812;
  padding: 9px 28px;
  font-size: 12px;
  max-height: 120px;
  overflow: auto;
}
.issue-banner summary {
  cursor: pointer;
}
.issue-banner ul {
  padding-left: 20px;
}
.paths-view {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.path-breadcrumb {
  font-size: 16px;
  padding: 20px 22px 0;
  position: relative;
  z-index: 1;
}
.path-breadcrumb span:first-child {
  color: var(--blue);
  font-family: var(--mono);
}
.path-breadcrumb span + span:before {
  content: "/";
  color: #65758f;
  margin: 0 13px;
}
.path-canvas {
  flex: 1;
  min-height: 80px;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
.path-canvas.dragging {
  cursor: grabbing;
}
.path-svg {
  width: 100%;
  height: 100%;
  display: block;
  user-select: none;
}
.graph-node {
  cursor: pointer;
  outline: none;
}
.graph-node rect {
  fill: #fff;
  stroke: #758db2;
  stroke-width: 1.1;
}
.graph-node.selected rect {
  fill: var(--cyan);
  stroke: var(--blue);
  stroke-width: 1.5;
}
.graph-node:hover rect,
.graph-node:focus rect {
  stroke: var(--blue);
  stroke-width: 2;
}
.graph-node text {
  font-family: var(--mono);
  fill: var(--ink);
  pointer-events: none;
}
.graph-node .graph-group {
  font-size: 11px;
  fill: #647596;
}
.graph-node .graph-name {
  font-size: 14px;
  font-weight: 650;
}
.graph-node .graph-version {
  font-size: 14px;
  fill: #526b93;
}
.graph-node.selected .graph-version {
  fill: var(--blue);
  font-weight: 700;
  font-size: 20px;
}
.graph-node .selected-tag {
  fill: var(--blue);
  font-size: 9px;
  font-family: var(--font);
  font-weight: 600;
}
.graph-edge {
  fill: none;
  stroke: #6b83a8;
  stroke-width: 1.2;
}
.graph-edge.changed {
  stroke: #e88900;
}
.graph-edge-label {
  font: 12px var(--font);
  fill: #536c92;
}
.graph-edge-label.changed {
  fill: #ce7500;
}
.path-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 22px 20px;
  flex-wrap: wrap;
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.zoom-controls .icon-btn {
  border: 1px solid #cfd9e8;
  border-radius: 4px;
  width: 34px;
  height: 34px;
}
.zoom-controls span {
  font-size: 13px;
  min-width: 38px;
  text-align: center;
}
.graph-legend {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 11px;
}
.graph-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.graph-legend svg {
  width: 20px;
  height: 20px;
}
.graph-legend .amber {
  color: var(--amber);
}
.graph-notice {
  padding: 4px 22px;
  font-size: 11px;
  color: var(--muted);
  background: var(--soft);
}
.graph-notice button {
  color: var(--blue);
  font-size: 11px;
}
.paths-view .empty-state {
  height: 100%;
}
.coordinate-box {
  display: block;
  width: 100%;
  resize: none;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--soft);
  font: 11px var(--mono);
  padding: 9px;
  color: var(--text);
}
dialog {
  border: 1px solid var(--line);
  border-radius: 10px;
  max-width: 600px;
  width: calc(100vw - 60px);
  padding: 24px;
  color: var(--ink);
  box-shadow: 0 15px 80px #10244225;
}
dialog::backdrop {
  background: #10244245;
}
.dialog-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dialog-title h2 {
  font-size: 20px;
  margin: 0;
}
#about-content {
  font-size: 13px;
  color: var(--text);
  line-height: 1.8;
}
#about-content h3 {
  font-size: 14px;
  margin: 20px 0 6px;
}
#about-content p {
  overflow-wrap: anywhere;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (min-width: 1550px) {
  .browser-area {
    grid-template-columns: minmax(0, 1fr) 440px;
  }
  .tree-header,
  .tree-row {
    grid-template-columns: minmax(230px, 1fr) 104px 156px;
  }
  .coordinate {
    font-size: 13px;
  }
}
@media (max-width: 1330px) {
  .stats {
    width: 100%;
    justify-content: flex-start;
    margin-left: 0;
  }
  .intro > p {
    margin-bottom: 19px;
  }
  .scope-row {
    gap: 12px;
  }
  .intro {
    padding-top: 18px;
  }
  .browser-area {
    grid-template-columns: minmax(0, 1fr) 340px;
  }
  .dependency-details {
    padding: 20px;
  }
  .app-shell {
    grid-template-columns: 165px minmax(0, 1fr);
  }
  .tree-header,
  .tree-row {
    padding: 0 15px;
    grid-template-columns: minmax(170px, 1fr) 70px 118px;
    gap: 8px;
  }
  .change-label {
    font-size: 10px;
  }
}
@media (max-width: 950px) {
  .app-shell {
    height: auto;
    min-height: calc(100vh - 60px);
    grid-template-columns: 135px minmax(0, 1fr);
  }
  .report-meta #environment {
    display: none;
  }
  .intro {
    padding: 20px;
  }
  .intro h1 {
    font-size: 30px;
  }
  .scope-row .configuration-label {
    flex: auto;
  }
  .scope-row select {
    min-width: 95px;
    max-width: 240px;
  }
  .browser-area {
    display: flex;
    flex-direction: column;
    flex: none;
    min-height: 500px;
  }
  .dependency-view {
    min-height: 480px;
    height: 60vh;
  }
  .dependency-details {
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .report-footer {
    padding: 12px 20px;
    height: auto;
    flex-wrap: wrap;
  }
  .report-footer button {
    margin-left: 0;
  }
  .search-field {
    width: 100%;
  }
  .search-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }
  .sidebar-note {
    display: none;
  }
  .brand {
    font-size: 18px;
  }
  .report-header {
    padding: 0 16px;
  }
  .module-btn {
    padding-left: 10px;
  }
  .project-name {
    padding-left: 16px;
    font-size: 14px;
  }
}

.reason-raw {
  font-size: 11px;
  color: var(--muted);
  margin-top: 7px;
}
.reason-raw summary {
  cursor: pointer;
}

  <body>
    <header class="report-header">
      <a class="brand" href="#" aria-label="依赖分析报告首页"
        ><span data-icon="cube"></span><strong>依赖分析报告</strong></a
      >
      <div class="report-meta">
        <span id="environment"></span><span id="report-date"></span>
      </div>
    </header>
    <div class="app-shell">
      <aside class="module-sidebar" aria-label="模块导航">
        <div id="project-name" class="project-name"></div>
        <nav id="module-nav"></nav>
        <div class="sidebar-note">
          Dependency Lens <span id="plugin-version"></span
          ><small>本地生成 · 离线可用</small>
        </div>
      </aside>
      <main class="workspace">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">依赖浏览器</h1>
          <p>查看依赖关系与最终解析版本</p>
          <div class="scope-row">
            <label
              >模块<select id="module-select" aria-label="模块"></select
            ></label>
            <label
              >构建变体<select
                id="variant-select"
                aria-label="构建变体"
              ></select
            ></label>
            <label class="configuration-label"
              >配置<select id="scope-select" aria-label="依赖配置"></select
            ></label>
            <div id="stats" class="stats" aria-live="polite"></div>
          </div>
          <div class="search-row">
            <div class="search-field">
              <span data-icon="search"></span
              ><input
                id="search"
                type="search"
                placeholder="搜索依赖坐标…"
                aria-label="搜索依赖坐标"
                autocomplete="off"
              /><button
                id="clear-search"
                class="icon-btn"
                aria-label="清空搜索"
                hidden
              >
                <span data-icon="x"></span>
              </button>
            </div>
            <label class="toggle-label"
              ><input type="checkbox" id="changes-only" role="switch" /><span
                class="toggle-track"
                aria-hidden="true"
              ></span
              >仅看版本变化</label
            >
          </div>
        </section>
        <div id="issue-banner" class="issue-banner" hidden></div>
        <div class="browser-area">
          <section class="dependency-view" aria-label="依赖关系">
            <div class="view-toolbar">
              <div class="view-tabs" role="tablist" aria-label="依赖视图">
                <button
                  id="tree-tab"
                  role="tab"
                  aria-selected="true"
                  aria-controls="tree-view"
                >
                  依赖树</button
                ><button
                  id="paths-tab"
                  role="tab"
                  aria-selected="false"
                  aria-controls="paths-view"
                >
                  依赖路径
                </button>
              </div>
              <span id="current-dependency"></span>
            </div>
            <div
              id="tree-view"
              role="tabpanel"
              aria-labelledby="tree-tab"
              class="tree-view"
            ></div>
            <div
              id="paths-view"
              role="tabpanel"
              aria-labelledby="paths-tab"
              class="paths-view"
              hidden
            ></div>
          </section>
          <aside
            id="dependency-details"
            class="dependency-details"
            aria-label="依赖详情"
          ></aside>
        </div>
        <footer class="report-footer">
          <span id="scope-note"></span><span>不代表 R8 裁剪后的代码留存</span
          ><button id="about-button">报告信息与许可证</button>
        </footer>
      </main>
    </div>
    <dialog id="about-dialog">
      <div class="dialog-title">
        <h2>关于这份报告</h2>
        <button id="close-about" class="icon-btn" aria-label="关闭">
          <span data-icon="x"></span>
        </button>
      </div>
      <div id="about-content"></div>
    </dialog>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>

                row.hasChildren &&
                !s.filter
              ) {
                event.preventDefault();
                if (event.key === "ArrowRight") s.expanded.add(row.path);
                else s.expanded.delete(row.path);
                app.renderView();
                document
                  .querySelector('[data-path="' + CSS.escape(row.path) + '"]')
                  ?.focus();
              }
              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                const all = [...host.querySelectorAll(".tree-row")],
                  n = all.indexOf(item) + (event.key === "ArrowDown" ? 1 : -1);
                all[n]?.focus();
              }
            },
          },
          name,
          el(
            "span",
            { class: "request-version", title: String(requested) },
            requested,
          ),
          el(
            "span",
            {
              class: "selected-version" + (!node.resolved ? " error-text" : ""),
            },
            el(
              "span",
              {},
              node.kind === "root"
                ? "—"
                : node.version || (node.resolved ? "—" : "未解析"),
            ),
            edge && changeLabel(edge)
              ? el("span", { class: "change-label" }, changeLabel(edge))
              : null,
          ),
        );
        list.append(item);
      }
      host.replaceChildren(header, list);
      if (count <= 1 && s.filter)
        host.append(
          empty(
            "没有匹配的依赖",
            "试试依赖名称、group 或版本号，也可以清除“仅看版本变化”筛选。",
            "search",
          ),
        );
      if (hasMore)
        host.append(
          el(
            "button",
            {
              class: "load-more",
              onclick: () => {
                s.rowLimit += 500;
                app.renderView();
              },
            },
            "继续显示更多依赖（每次 500 行）",
          ),
        );
      host.scrollTop = scroll;
    },
  };
})();

</script>

<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs = {}, ...children) {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    for (const c of children)
      n.append(typeof c === "string" ? document.createTextNode(c) : c);
    return n;
  }
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
  function route(points) {
    if (points.length < 2) return "";
    let result = `M${points[0].x},${points[0].y}`;
    for (let i = 1; i < points.length - 1; i++) {
      const p = points[i],
        next = points[i + 1];
      result += ` Q${p.x},${p.y} ${(p.x + next.x) / 2},${(p.y + next.y) / 2}`;
    }
    const last = points[points.length - 1];
    return result + ` L${last.x},${last.y}`;
  }
  function layout(data, idx, selected) {
    const ancestor = window.LensModel.ancestors(idx, [selected]),
      primary = new dagre.graphlib.Graph({ multigraph: true }),
      children = new dagre.graphlib.Graph({ multigraph: true });
    for (const graph of [primary, children]) {
      graph.setDefaultEdgeLabel(() => ({}));
      graph.setGraph({
        rankdir: graph === primary ? "LR" : "TB",
        ranksep: 55,
        nodesep: 50,
        edgesep: 16,
        marginx: 20,
        marginy: 20,
      });
    }
    for (const n of data.nodes) {
      const shape = {
        width: n.id === idx.root ? 85 : 205,
        height: n.id === idx.root ? 48 : 86,
      };
      (ancestor.has(n.id) ? primary : children).setNode(n.id, shape);
    }
    const selectedShape = { width: 205, height: 86 };
    if (data.nodes.some((n) => !ancestor.has(n.id)))
      children.setNode(selected, selectedShape);
    for (const e of data.edges) {
      const target = idx.nodes.get(e.to),
        label =
          e.to === selected
            ? e.requested.version
              ? "请求 " + e.requested.version
              : "依赖请求"
            : e.from === selected
              ? "子依赖"
              : "";
      const info = { width: label ? 95 : 0, height: label ? 20 : 0, label };
      const graph =
        ancestor.has(e.from) && ancestor.has(e.to) ? primary : children;
      if (graph.hasNode(e.from) && graph.hasNode(e.to))
        graph.setEdge(e.from, e.to, info, e.id);
    }
    dagre.layout(primary);
    if (children.nodeCount()) dagre.layout(children);
    const positions = new Map(),
      edgeLayouts = new Map(),
      p = primary.node(selected),
      c = children.node(selected);
    const dx = p && c ? p.x - c.x : 0,
      dy = p && c ? p.y - c.y : 0;
    for (const n of data.nodes) {
      const usePrimary = ancestor.has(n.id),
        g = usePrimary ? primary : children,
        value = g.node(n.id);
      if (value)
        positions.set(n.id, {
          ...value,
          x: value.x + (usePrimary ? 0 : dx),
          y: value.y + (usePrimary ? 0 : dy),
        });
    }
    for (const e of data.edges) {
      const g = ancestor.has(e.from) && ancestor.has(e.to) ? primary : children,
        v = g.edge({ v: e.from, w: e.to, name: e.id });
      if (v)
        edgeLayouts.set(e.id, {
          ...v,
          x: v.x + (g === primary ? 0 : dx),
          y: v.y + (g === primary ? 0 : dy),
          points: v.points.map((p) => ({
            x: p.x + (g === primary ? 0 : dx),
            y: p.y + (g === primary ? 0 : dy),
          })),
        });
    }
    let minX = Infinity,
      minY = Infinity,
      maxX = -Infinity,
      maxY = -Infinity;
    for (const p of positions.values()) {
      minX = Math.min(minX, p.x - p.width / 2);
      maxX = Math.max(maxX, p.x + p.width / 2);
      minY = Math.min(minY, p.y - p.height / 2);
      maxY = Math.max(maxY, p.y + p.height / 2);
    }
    return {
      positions,
      edgeLayouts,
      minX,
      minY,
      width: Math.max(1, maxX - minX),
      height: Math.max(1, maxY - minY),
    };
  }
  window.LensPaths = {
    render(app) {
      const { el, icon, empty } = window.LensUI,
        s = app.state,
        host = document.getElementById("paths-view"),
        node = s.idx.nodes.get(s.selectedId);
      if (!node || node.id === s.idx.root) {
        host.replaceChildren(
          empty(
            s.filter && !s.filter.hits.size
              ? "没有匹配的依赖"
              : "选择一个依赖查看路径",
            "先在依赖树中选择依赖，或使用上方搜索定位依赖。",
            "arrows-split",
          ),
        );
        return;
      }
      const data = window.LensModel.pathGraph(
        s.idx,
        node.id,
        s.childExpanded,
        s.pathLimit,
      );
      const crumb = el(
        "div",
        { class: "path-breadcrumb" },
        el("span", {}, s.idx.graph.module),
        el("span", {}, node.name),
      );
      const canvas = el("div", { class: "path-canvas" }),
        sheet = svg("svg", {
          class: "path-svg",
          role: "group",
          "aria-label": node.name + " 的依赖引入路径",
        }),
        group = svg("g");
      const defs = svg("defs");
      for (const [id, color] of [
        ["normal", "#6b83a8"],
        ["changed", "#e88900"],
      ])
        defs.append(
          svg(
            "marker",
            {
              id: "arrow-" + id,
              viewBox: "0 0 10 10",
              refX: 9,
              refY: 5,
              markerWidth: 7,
              markerHeight: 7,
              orient: "auto-start-reverse",
            },
            svg("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }),
          ),
        );
      sheet.append(defs, group);
      canvas.append(sheet);
      const controls = el("div", { class: "zoom-controls" }),
        zoomText = el("span", {}, "100%");
      const legend = el(
        "div",
        { class: "graph-legend" },
        el("span", {}, icon("arrow-right"), "依赖方向"),
        el("span", { class: "amber" }, icon("arrow-right"), "请求版本发生变化"),
      );
      const notice = el("div", { class: "graph-notice" });
      if (data.hidden > 0)
        notice.append(
          document.createTextNode(
            "已折叠 " +
              data.hidden +
              " 个相关节点，当前显示 " +
              data.nodes.length +
              " / " +
              data.total +
              "。",
          ),
          el(
            "button",
            {
              onclick: () => {
                s.pathLimit += 200;
                app.renderView();
              },
            },
            "继续展开 200 个",
          ),
        );
      else notice.hidden = true;
      const expand = el(
        "button",
        {
          class: "text-button",
          onclick: () => {
            for (const id of data.children) s.childExpanded.add(id);
            app.renderView();
          },
        },
        "展开一层子依赖",
      );
      const canExpand = [...data.children].some(
        (id) =>
          !s.childExpanded.has(id) &&
          (s.idx.outgoing.get(id) || []).some(
            (e) => !e.constraint && !data.nodes.some((x) => x.id === e.to),
          ),
      );
      expand.hidden = !canExpand;
      host.replaceChildren(
        crumb,
        notice,
        canvas,
        el("div", { class: "path-actions" }, controls, expand, legend),
      );
      const placed = layout(data, s.idx, node.id);
      for (const edge of data.edges) {
        const v = placed.edgeLayouts.get(edge.id);
        if (!v) continue;
        const changed = window.LensModel.changed(edge);
        const path = svg("path", {
          d: route(v.points),
          class: "graph-edge" + (changed ? " changed" : ""),
          "marker-end": "url(#arrow-" + (changed ? "changed" : "normal") + ")",
        });
        path.append(svg("title", {}, edge.requested.display));
        group.append(path);
        if (v.label) {
          const bg = svg("rect", {
            x: v.x - 49,
            y: v.y - 11,
            width: 98,
            height: 22,
            rx: 3,
            fill: changed ? "#fff5e5" : "#ffffff",
          });
          const label = svg(
            "text",
            {
              x: v.x,
              y: v.y + 3,
              "text-anchor": "middle",
              class: "graph-edge-label" + (changed ? " changed" : ""),
            },
            v.label,
          );
          group.append(bg, label);
        }
      }
      for (const n of data.nodes) {
        const p = placed.positions.get(n.id);
        if (!p) continue;
        const x = p.x - p.width / 2,
          y = p.y - p.height / 2;
        const element = svg("g", {
          class: "graph-node" + (n.id === node.id ? " selected" : ""),
          transform: `translate(${x},${y})`,
          tabindex: 0,
          role: "button",
          "aria-label": n.coordinate,
          "data-graph-node": n.id,
        });
        element.append(
          svg("title", {}, n.coordinate),
          svg("rect", { width: p.width, height: p.height, rx: 4 }),
        );
        if (n.id === s.idx.root)
          element.append(
            svg(
              "text",
              {
                x: p.width / 2,
                y: 29,
                "text-anchor": "middle",
                class: "graph-name",
              },
              n.name,
            ),
          );
        else {
          element.append(
            svg(
              "text",
              { x: 15, y: 22, class: "graph-group" },
              short(
                n.group ||
                  (n.kind === "project"
                    ? "项目依赖"
                    : n.kind === "file"
                      ? "本地文件"
                      : "组件"),
                29,
              ),
            ),
            svg(
              "text",
              { x: 15, y: 44, class: "graph-name" },
              short(n.name, 25),
            ),
            svg(
              "text",
              { x: 15, y: 68, class: "graph-version" },
              n.version || (n.resolved ? "—" : "未解析"),
            ),
          );
          if (n.id === node.id)
            element.append(
              svg(
                "text",
                {
                  x: p.width - 11,
                  y: 65,
                  "text-anchor": "end",
                  class: "selected-tag",
                },
                "最终解析",
              ),
            );
        }
        element.addEventListener("click", () => app.select(n.id));
        element.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            app.select(n.id);
          }
        });
        group.append(element);
      }
      let scale = 1,
        tx = 0,
        ty = 0,
        drag = null;
      const update = () => {
        group.setAttribute(
          "transform",
          `translate(${tx},${ty}) scale(${scale})`,
        );
        zoomText.textContent = Math.round(scale * 100) + "%";
      };
      const fit = () => {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        sheet.setAttribute("viewBox", `0 0 ${w} ${h}`);
        scale = Math.min(
          (w - 52) / placed.width,
          (h - 44) / placed.height,
          1.1,
        );
        scale = Math.max(0.05, scale);
        tx = (w - placed.width * scale) / 2 - placed.minX * scale;
        ty = (h - placed.height * scale) / 2 - placed.minY * scale;
        update();
      };
      const zoom = (factor) => {
        const old = scale;
        scale = Math.max(0.05, Math.min(3, scale * factor));
        const cx = canvas.clientWidth / 2,
          cy = canvas.clientHeight / 2;
        tx = cx - ((cx - tx) * scale) / old;
        ty = cy - ((cy - ty) * scale) / old;
        update();
      };
      controls.append(
        el(
          "button",
          {
            class: "icon-btn",
            "aria-label": "缩小路径图",
            onclick: () => zoom(1 / 1.2),
          },
          icon("minus"),
        ),
        zoomText,
        el(
          "button",
          {
            class: "icon-btn",
            "aria-label": "放大路径图",
            onclick: () => zoom(1.2),
          },
          icon("plus"),
        ),
        el("button", { class: "text-button", onclick: fit }, "适应画布"),
      );
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1);
        },
        { passive: false },
      );
      canvas.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".graph-node")) return;
        drag = { x: e.clientX, y: e.clientY, tx, ty };
        canvas.setPointerCapture(e.pointerId);
        canvas.classList.add("dragging");
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drag) return;
        tx = drag.tx + e.clientX - drag.x;
        ty = drag.ty + e.clientY - drag.y;
        update();
      });
      const end = () => {
        drag = null;
        canvas.classList.remove("dragging");
      };
      canvas.addEventListener("pointerup", end);
      canvas.addEventListener("pointercancel", end);
      fit();
    },
  };
})();

</script>

<script>
(function () {
  "use strict";
  const reasonNames = {
    CONFLICT_RESOLUTION: "版本冲突解决",
    FORCED: "强制版本",
    CONSTRAINT: "依赖约束",
    SELECTED_BY_RULE: "规则选择",
    COMPOSITE_BUILD: "包含构建替换",
    REJECTION: "候选版本被拒绝",
    REQUESTED: "依赖请求",
    ROOT: "根组件",
    BY_ANCESTOR: "上游严格约束",
  };
  window.LensDetails = {
    render(app) {
      const { el, icon, empty, changeLabel } = window.LensUI,
        s = app.state,
        host = document.getElementById("dependency-details");
      const node = s.idx.nodes.get(s.selectedId);
      if (!node || node.id === s.idx.root) {
        host.replaceChildren(
          empty(
            "选择一个依赖",
            "查看最终解析版本、选择原因，以及它的引入路径。",
            "cube",
          ),
        );
        return;
      }
      const copy = el(
        "button",
        {
          class: "copy-btn",
          "aria-label": "复制依赖坐标",
          onclick: async () => {
            try {
              await navigator.clipboard.writeText(node.coordinate);
              copy.replaceChildren(
                icon("check"),
                document.createTextNode("已复制"),
              );
            } catch (_) {
              const box = el(
                "textarea",
                {
                  class: "coordinate-box",
                  readonly: true,
                  "aria-label": "可复制的依赖坐标",
                },
                node.coordinate,
              );
              host.prepend(box);
              box.focus();
              box.select();
            }
          },
        },
        icon("copy"),
        "复制坐标",
      );
      const title = el(
        "div",
        { class: "details-header" },
        el("h2", {}, node.name),
        copy,
        el(
          "div",
          { class: "details-group" },
          node.group ? node.group + ":" + node.name : node.coordinate,
        ),
      );
      const version = el(
        "section",
        { class: "detail-section" },
        el(
          "div",
          { class: "detail-label" },
          node.resolved ? "最终解析版本" : "解析状态",
        ),
        el(
          "div",
          {
            class: "final-version" + (!node.resolved ? " error-text" : ""),
            style: node.version ? "" : "font-size:26px",
          },
          node.version ||
            (!node.resolved
              ? "未解析"
              : node.kind === "file"
                ? "本地文件"
                : node.kind === "platform"
                  ? "平台依赖"
                  : "项目依赖"),
        ),
        node.kind === "platform"
          ? el(
              "p",
              { class: "detail-note" },
              "平台用于管理版本，不包含运行时代码。",
            )
          : null,
        !node.resolved
          ? el(
              "p",
              { class: "detail-note error-text" },
              node.error || "请检查依赖声明、仓库或离线缓存。",
            )
          : null,
      );
      const incoming = s.idx.incoming.get(node.id) || [],
        requestRows = new Map();
      for (const edge of incoming) {
        const version =
          edge.requested.version ||
          edge.requested.versionConstraint?.strict ||
          edge.requested.versionConstraint?.preferred ||
          (edge.requested.kind === "module"
            ? "由约束确定"
            : edge.requested.display);
        const key =
          String(version) + "|" + edge.changeKind + "|" + edge.constraint;
        if (!requestRows.has(key)) requestRows.set(key, { version, edge });
      }
      const requests = el(
        "section",
        { class: "detail-section" },
        el("h3", {}, "请求版本"),
      );
      for (const { version: v, edge } of requestRows.values())
        requests.append(
          el(
            "div",
            {
              class:
                "request-row" +
                (window.LensModel.changed(edge) ? " changed" : ""),
            },
            el("span", {}, v),
            icon("arrow-right"),
            el(
              "span",
              {},
              node.version ||
                (!node.resolved
                  ? "未解析"
                  : node.kind === "file"
                    ? "本地文件"
                    : "项目依赖"),
            ),
            edge.constraint
              ? el("small", {}, "约束")
              : changeLabel(edge)
                ? el("small", {}, changeLabel(edge))
                : null,
          ),
        );
      const reasons = el(
        "section",
        { class: "detail-section" },
        el("h3", {}, icon("stack-2"), "选择原因"),
      );
      const meaningful = (node.reasons || []).filter(
        (r) => r.cause !== "REQUESTED" && r.cause !== "ROOT",
      );
      if (!meaningful.length)
        reasons.append(
          el(
            "div",
            { class: "reason-item" },
            el(
              "div",
              { class: "reason-title" },
              node.kind === "file" ? "本地文件依赖" : "按依赖请求解析",
            ),
            el(
              "p",
              { class: "reason-description" },
              node.kind === "file"
                ? "文件没有可用的外部传递依赖元数据。"
                : "Gradle 未报告额外的冲突、强制版本或替换原因。",
            ),
          ),
        );
      for (const reason of meaningful) {
        const explanation =
          reason.cause === "CONFLICT_RESOLUTION"
            ? "多个依赖请求了不同版本，Gradle 选择了 " +
              (node.version || node.coordinate) +
              "。"
            : null;
        reasons.append(
          el(
            "div",
            { class: "reason-item" },
            el(
              "div",
              { class: "reason-title" },
              reasonNames[reason.cause] || reason.cause,
            ),
            el(
              "p",
              { class: "reason-description" },
              explanation || reason.description,
            ),
            explanation
              ? el(
                  "details",
                  { class: "reason-raw" },
                  el("summary", {}, "Gradle 原始原因"),
                  el("p", { class: "reason-description" }, reason.description),
                )
              : null,
          ),
        );
      }
      const constraints = incoming.filter((e) => e.constraint);
      if (constraints.length)
        reasons.append(
          el(
            "div",
            { class: "reason-item" },
            el("div", { class: "reason-title" }, "约束来源"),
            ...constraints.map((e) =>
              el(
                "p",
                { class: "reason-description" },
                s.idx.nodes.get(e.from).coordinate +
                  " · " +
                  e.requested.display,
              ),
            ),
          ),
        );
      const allPaths = window.LensModel.introductionPaths(s.idx, node.id),
        paths = el(
          "section",
          { class: "detail-section" },
          el("h3", {}, icon("arrows-split"), "引入路径"),
        );
      if (!allPaths.length)
        paths.append(
          el(
            "p",
            { class: "detail-note" },
            "当前依赖没有普通引入路径，请查看约束来源或解析问题。",
          ),
        );
      allPaths.slice(0, s.detailsPathLimit).forEach((path, i) => {
        const line = el(
          "div",
          { class: "path-coordinates" },
          el("span", {}, s.idx.nodes.get(s.idx.root).name),
        );
        for (const edge of path) {
          const n = s.idx.nodes.get(edge.to);
          line.append(
            el("span", { class: "path-arrow" }, "→"),
            el(
              "span",
              { title: edge.requested.display },
              (n.group ? n.group + ":" : "") +
                n.name +
                (n.version ? ":" + n.version : ""),
            ),
          );
        }
        paths.append(
          el(
            "div",
            { class: "incoming-path" },
            el("span", { class: "path-number" }, i + 1),
            line,
          ),
        );
      });
      if (allPaths.length > s.detailsPathLimit)
        paths.append(
          el(
            "button",
            {
              class: "text-button",
              onclick: () => {
                s.detailsPathLimit += 6;
                app.renderDetails();
              },
            },
            "显示更多来源（" + (allPaths.length - s.detailsPathLimit) + "）",
          ),
        );
      if (allPaths.length)
        paths.append(
          el(
            "p",
            { class: "detail-note" },
            "每个直接来源展示一条最短路径，完整关系见依赖路径视图。",
          ),
        );
      paths.append(
        el(
          "button",
          { class: "text-button", onclick: () => app.locateTree(node.id) },
          "在依赖树中定位",
          icon("arrow-right"),
        ),
      );
      const children = (s.idx.outgoing.get(node.id) || []).filter(
        (e) => !e.constraint,
      );
      const childSection = el(
        "section",
        { class: "detail-section" },
        el("h3", {}, "直接子依赖"),
      );
      if (!children.length)
        childSection.append(
          el("p", { class: "detail-note" }, "当前解析变体没有直接子依赖。"),
        );
      const unique = new Set();
      for (const edge of children) {
        if (unique.has(edge.to)) continue;
        unique.add(edge.to);
        const n = s.idx.nodes.get(edge.to);
        childSection.append(
          el(
            "button",
            { class: "child-item", onclick: () => app.select(n.id, edge.id) },
            n.coordinate,
          ),
        );
      }
      const attributes = el(
        "details",
        { class: "variant-details" },
        el("summary", {}, "已选变体与属性"),
      );
      const attrList = el("dl", { class: "attribute-list" });
      if (node.variant)
        attrList.append(el("dt", {}, "variant"), el("dd", {}, node.variant));
      for (const [key, value] of Object.entries(node.attributes || {}))
        attrList.append(el("dt", {}, key), el("dd", {}, value));
      for (const cap of node.capabilities || [])
        attrList.append(el("dt", {}, "capability"), el("dd", {}, cap));
      attributes.append(attrList);
      host.replaceChildren(
        title,
        version,
        requests,
        reasons,
        paths,
        childSection,
        attributes,
      );
    },
  };
})();

</script>

<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("report-data").textContent),
    M = window.LensModel;
  function el(tag, attrs = {}, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "class") n.className = v;
      else if (k === "readonly") n.readOnly = Boolean(v);
      else n.setAttribute(k, String(v));
    }
    for (const child of children.flat())
      if (child !== null && child !== undefined)
        n.append(
          typeof child === "object"
            ? child
            : document.createTextNode(String(child)),
        );
    return n;
  }
  function icon(name) {
    const t = document.createElement("template");
    t.innerHTML = window.LensIcons[name] || window.LensIcons.cube;
    const n = t.content.firstElementChild;
    n.classList.add("icon");
    n.setAttribute("aria-hidden", "true");
    return n;
  }
  function empty(title, description, name) {
    return el(
      "div",
      { class: "empty-state" },
      icon(name),
      el("h3", {}, title),
      el("p", {}, description),
    );
  }
  const typeLabel = (n) =>
    ({ project: "项目", platform: "平台", file: "本地", unresolved: "未解析" })[
      n.kind
    ] || "";
  const changeLabel = (e) =>
    ({
      version: "版本变化",
      substitution: "依赖替换",
      dynamic: "动态解析",
      managed: "约束定版",
    })[e.changeKind] || "";
  window.LensUI = { el, icon, empty, typeLabel, changeLabel };
  document
    .querySelectorAll("[data-icon]")
    .forEach((n) => n.replaceChildren(icon(n.dataset.icon)));
  const modules = [...data.modules].sort((a, b) =>
    a.path.localeCompare(b.path),
  );
  const first = modules.find((m) => m.type === "application") || modules[0];
  const s = {
    module: first.path,
    variant: "",
    scope: "runtime",
    idx: null,
    mode: "tree",
    selectedId: null,
    selectedEdge: null,
    query: "",
    changesOnly: false,
    expanded: new Set(["root"]),
    rowLimit: 500,
    pathLimit: 200,
    childExpanded: new Set(),
    detailsPathLimit: 6,
    filter: null,
  };
  const app = {
    state: s,
    data,
    select(id, edge) {
      if (s.selectedId !== id) {
        s.childExpanded = new Set([id]);
        s.detailsPathLimit = 6;
        s.pathLimit = 200;
      }
      s.selectedId = id;
      s.selectedEdge = edge || null;
      this.renderView();
      this.renderDetails();
    },
    renderDetails() {
      window.LensDetails.render(this);
    },
    renderView() {
      document.getElementById("tree-view").hidden = s.mode !== "tree";
      document.getElementById("paths-view").hidden = s.mode !== "paths";
      document
        .getElementById("tree-tab")
        .setAttribute("aria-selected", String(s.mode === "tree"));
      document
        .getElementById("paths-tab")
        .setAttribute("aria-selected", String(s.mode === "paths"));
      document.getElementById("current-dependency").textContent =
        s.selectedId && s.idx.nodes.get(s.selectedId)
          ? "当前依赖：" + s.idx.nodes.get(s.selectedId).name
          : "";
      if (s.mode === "tree") window.LensTree.render(this);
      else window.LensPaths.render(this);
    },
    locateTree(id) {
      const path = M.shortestPath(s.idx, id);
      if (path === null) {
        document.getElementById("announcement").textContent =
          "此组件仅由约束引用，没有普通引入路径。";
        return;
      }
      s.query = "";
      s.changesOnly = false;
      s.filter = null;
      document.getElementById("search").value = "";
      document.getElementById("changes-only").checked = false;
      document.getElementById("clear-search").hidden = true;
      let key = "root";
      s.expanded.add(key);
      for (const edge of path) {
        key += "/" + edge.id;
        s.expanded.add(key);
      }
      s.mode = "tree";
      s.rowLimit = Math.max(500, path.length + 50);
      s.selectedId = id;
      s.selectedEdge = path[path.length - 1]?.id || null;
      this.renderView();
      this.renderDetails();
      let target = document.querySelector(
        '[data-path="' + CSS.escape(key) + '"]',
      );
      while (!target && document.querySelector(".load-more")) {
        s.rowLimit += 500;
        this.renderView();
        target = document.querySelector(
          '[data-path="' + CSS.escape(key) + '"]',
        );
      }
      target?.scrollIntoView({ block: "center" });
      target?.focus({ preventScroll: true });
    },
    updateFilters() {
      s.filter = M.matches(s.idx, s.query, s.changesOnly);
      s.rowLimit = 500;
      if (s.mode === "paths" && s.filter && !s.filter.hits.has(s.selectedId)) {
        s.selectedId = [...s.filter.hits][0] || null;
        s.selectedEdge = null;
        s.childExpanded = new Set([s.selectedId]);
        s.detailsPathLimit = 6;
        s.pathLimit = 200;
      }
      this.renderView();
      this.renderDetails();
    },
  };
  function selectOptions(select, values, selected) {
    select.replaceChildren(
      ...values.map((v) =>
        el(
          "option",
          {
            value: v.value ?? v,
            ...(String(v.value ?? v) === String(selected)
              ? { selected: "" }
              : {}),
          },
          v.label ?? v,
        ),
      ),
    );
  }
  function changeGraph(modulePath, variant, scope) {
    s.module = modulePath;
    const module = modules.find((m) => m.path === modulePath),
      variants = [...new Set(module.graphs.map((g) => g.variant))].sort();
    s.variant = variants.includes(variant)
      ? variant
      : variants.includes("release")
        ? "release"
        : variants[0];
    const graphs = module.graphs.filter((g) => g.variant === s.variant);
    s.scope = graphs.some((g) => g.scope === scope)
      ? scope
      : graphs.some((g) => g.scope === "runtime")
        ? "runtime"
        : graphs[0].scope;
    s.idx = M.index(graphs.find((g) => g.scope === s.scope));
    s.selectedId = null;
    s.selectedEdge = null;
    s.expanded = new Set(["root"]);
    s.rowLimit = 500;
    s.pathLimit = 200;
    s.detailsPathLimit = 6;
    s.childExpanded = new Set();
    s.filter = M.matches(s.idx, s.query, s.changesOnly);
    selectOptions(
      document.getElementById("module-select"),
      modules.map((m) => m.path),
      s.module,
    );
    selectOptions(
      document.getElementById("variant-select"),
      variants,
      s.variant,
    );
    selectOptions(
      document.getElementById("scope-select"),
      graphs.map((g) => ({ value: g.scope, label: g.configuration })),
      s.scope,
    );
    document.querySelectorAll(".module-btn").forEach((n) => {
      n.classList.toggle("active", n.dataset.module === s.module);
      if (n.dataset.module === s.module) n.setAttribute("aria-current", "true");
      else n.removeAttribute("aria-current");
    });
    const stats = M.stats(s.idx);
    document
      .getElementById("stats")
      .replaceChildren(
        el("span", {}, "直接依赖", el("strong", {}, stats.direct)),
        el("span", {}, "传递依赖", el("strong", {}, stats.transitive)),
        el(
          "span",
          {},
          "版本变化",
          el("strong", { class: "changed-count" }, stats.changes),
        ),
      );
    document.getElementById("scope-note").textContent =
      "当前视图：" +
      (s.scope === "runtime" ? "运行时" : "编译时") +
      "依赖解析结果";
    const banner = document.getElementById("issue-banner"),
      issues = s.idx.graph.issues || [];
    banner.hidden = s.idx.graph.status === "complete";
    banner.replaceChildren();
    if (!banner.hidden) {
      const details = el(
        "details",
        {},
        el(
          "summary",
          {},
          (s.idx.graph.status === "failed"
            ? "此配置解析失败"
            : "此配置存在解析问题") +
            " · 当前报告可能不完整（" +
            issues.length +
            " 项）",
        ),
        el(
          "ul",
          {},
          ...issues.map((i) =>
            el("li", {}, (i.requested ? i.requested + "：" : "") + i.message),
          ),
        ),
      );
      banner.append(details);
    }
    app.renderView();
    app.renderDetails();
  }
  document.getElementById("project-name").textContent = data.projectName;
  document.getElementById("plugin-version").textContent = data.pluginVersion;
  document.getElementById("report-date").textContent =
    (data.demo ? "演示数据 · " : "") + String(data.generatedAt).slice(0, 10);
  document.getElementById("environment").textContent =
    "Gradle " + data.gradleVersion;
  document.title = data.projectName + " · 依赖分析报告";
  document
    .getElementById("module-nav")
    .replaceChildren(
      ...modules.map((m) =>
        el(
          "button",
          {
            class: "module-btn",
            "data-module": m.path,
            onclick: () => changeGraph(m.path, s.variant, s.scope),
          },
          m.path,
        ),
      ),
    );
  document
    .getElementById("module-select")
    .addEventListener("change", (e) =>
      changeGraph(e.target.value, s.variant, s.scope),
    );
  document
    .getElementById("variant-select")
    .addEventListener("change", (e) =>
      changeGraph(s.module, e.target.value, s.scope),
    );
  document
    .getElementById("scope-select")
    .addEventListener("change", (e) =>
      changeGraph(s.module, s.variant, e.target.value),
    );
  let searchTimer;
  document.getElementById("search").addEventListener("input", (e) => {
    s.query = e.target.value;
    document.getElementById("clear-search").hidden = !s.query;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => app.updateFilters(), 100);
  });
  document.getElementById("clear-search").addEventListener("click", () => {
    clearTimeout(searchTimer);
    s.query = "";
    document.getElementById("search").value = "";
    document.getElementById("clear-search").hidden = true;
    app.updateFilters();
    document.getElementById("search").focus();
  });
  document.getElementById("changes-only").addEventListener("change", (e) => {
    s.changesOnly = e.target.checked;
    app.updateFilters();
  });
  for (const mode of ["tree", "paths"])
    document.getElementById(mode + "-tab").addEventListener("click", () => {
      s.mode = mode;
      app.updateFilters();
    });
  const dialog = document.getElementById("about-dialog");
  document.getElementById("about-button").addEventListener("click", () => {
    document
      .getElementById("about-content")
      .replaceChildren(
        el("h3", {}, data.projectName),
        el("p", {}, "生成时间：" + data.generatedAt),
        el(
          "p",
          {},
          "Dependency Lens " +
            data.pluginVersion +
            " · Gradle " +
            data.gradleVersion,
        ),
        ...modules.map((m) => el("p", {}, m.path + " · AGP " + m.agpVersion)),
        el("h3", {}, "解析结果说明"),
        el(
          "p",
          {},
          "结果只对应各模块、变体和 Configuration。本地文件没有可推断的外部依赖元数据；平台与约束管理版本。报告不执行 APK/AAB 或 R8 代码留存分析。",
        ),
        el("h3", {}, "第三方许可证"),
        el(
          "p",
          {},
          "Dagre 1.1.5 / Graphlib：MIT License，Copyright (c) 2012–2014 Chris Pettitt。Tabler Icons 3.35.0：MIT License，Copyright (c) 2020 Paweł Kuna。许可允许使用、复制、修改、合并、发布、分发、再许可及销售，但须保留版权与许可声明。软件按“原样”提供，不附带任何明示或暗示保证，包括适销性、特定用途适用性或不侵权保证；作者不对使用软件产生的损害或其他责任负责。完整原文见插件发行包中的 THIRD-PARTY-NOTICES.txt。",
        ),
      );
    const licenses = JSON.parse(
      document.getElementById("third-party-licenses").textContent,
    );
    for (const [name, text] of Object.entries(licenses))
      document
        .getElementById("about-content")
        .append(
          el(
            "details",
            {},
            el("summary", {}, name + " 完整许可证"),
            el("pre", { style: "white-space:pre-wrap;font-size:10px" }, text),
          ),
        );
    dialog.showModal();
  });
  document
    .getElementById("close-about")
    .addEventListener("click", () => dialog.close());
  document.querySelector(".brand").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("search").focus();
  });
  window.addEventListener("resize", () => {
    if (s.mode === "paths") app.renderView();
  });
  changeGraph(first.path, "release", "runtime");
})();

</script>
